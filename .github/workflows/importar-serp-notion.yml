name: Importar pesquisas SERP para o arquivo do Notion

# Manual: cria uma página no arquivo "Pesquisas SerpAPI" para cada pesquisa de
# data/entrada/pautas-chat_01/resposta/. Não commita nada e não publica.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Criar páginas no arquivo de pesquisas
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: node scripts/importar-serp-para-notion.js --gravar
