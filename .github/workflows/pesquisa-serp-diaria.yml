name: SERP e atualização de pautas

# Workflow único para pesquisa SERP, validação de pautas e comparação SEO.
# O disparo sem input executa a pesquisa diária padrão, compatível com cron-job.org via workflow_dispatch.
# Pesquisa SERP consome cota apenas quando uma busca nova é realmente necessária.
# "PESQUISA CONCLUÍDA" significa que o JSON da SERP foi confirmado; não significa artigo aprovado ou publicado.

on:
  # Execução manual ou pelo cron-job.org: sem campos, lê as pautas do repositório.
  workflow_dispatch:
  # Tarefas auxiliares podem ser chamadas por API sem pedir palavras-chave.
  repository_dispatch:
    types:
      - validar_pautas
      - comparar_topo
  # O agendamento externo (cron-job.org) continua disparando via API workflow_dispatch.
  # Não adicionar schedule aqui para evitar execuções duplicadas.

permissions:
  contents: write

concurrency:
  group: pesquisa-serp
  cancel-in-progress: false

jobs:
  pesquisar:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Pesquisar na SerpAPI (até 5 pautas)
        id: pesquisar
        env:
          SERP_API_KEY: ${{ secrets.SERP___APIKEY }}
        run: node scripts/pesquisa-serp-diaria.js

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action SERP"
          git add data/entrada/pautas-chat_01/resposta data/conteudo/pautas-mestre.json
          if git diff --staged --quiet; then
            echo "Nada novo para gravar"
            exit 0
          fi
          git commit -m "🤖 Pesquisa SerpAPI diária"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Enviar pesquisas novas ao Notion (sem duplicar)
        if: steps.pesquisar.outputs.pesquisas != ''
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          PESQUISAS: ${{ steps.pesquisar.outputs.pesquisas }}
        run: |
          while IFS= read -r palavra; do
            [ -n "$palavra" ] || continue
            PALAVRA="$palavra" node scripts/enviar-serp-notion.js
          done <<< "$PESQUISAS"
  validar:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'validar_pautas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar pautas (regras + fontes online)
        run: node scripts/validar-pautas.js --online

  comparar:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'comparar_topo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparar automaticamente com o topo do Google
        run: node scripts/comparar-topo.js
      - name: Gravar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pesquisa/comparacao-topo.json data/pesquisa/comparacao-topo.md
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Comparação com o topo do Google atualizada"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || exit 1
