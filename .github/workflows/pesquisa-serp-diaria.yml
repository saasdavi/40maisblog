name: SERP e atualização de pautas

# Workflow único para pesquisa SERP, validação de pautas e comparação SEO.
# O disparo sem input executa a pesquisa diária padrão, compatível com cron-job.org via workflow_dispatch.
# Pesquisa SERP consome cota apenas quando uma busca nova é realmente necessária.
# "PESQUISA CONCLUÍDA" significa que o JSON da SERP foi confirmado; não significa artigo aprovado ou publicado.

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "Escolha a tarefa a executar"
        required: true
        type: choice
        default: pesquisa_serp
        options:
          - pesquisa_serp
          - validar_pautas
          - comparar_topo
      limite:
        description: "Limite de pautas na validação (vazio = todas as livres)"
        required: false
        default: ""
      so:
        description: "Filtro de palavra para comparação do topo (vazio = todas)"
        required: false
        default: ""
  # O agendamento externo (cron-job.org) continua disparando via API workflow_dispatch.
  # Não adicionar schedule aqui para evitar execuções duplicadas.

permissions:
  contents: write

concurrency:
  group: pesquisa-serp
  cancel-in-progress: false

jobs:
  pesquisar:
    if: ${{ inputs.tarefa == 'pesquisa_serp' || inputs.tarefa == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pesquisar na SerpAPI (1 pauta)
        id: pesquisar
        env:
          SERP_API_KEY: ${{ secrets.SERP___APIKEY }}
        run: node scripts/pesquisa-serp-diaria.js

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action SERP"
          git add data/entrada/pautas-chat_01/resposta data/conteudo/pautas-mestre.csv
          if git diff --staged --quiet; then
            echo "Nada novo para gravar"
            exit 0
          fi
          git commit -m "🤖 Pesquisa SerpAPI diária"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Enviar pesquisa nova ao Notion
        if: steps.pesquisar.outputs.pesquisa != ''
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          PALAVRA: ${{ steps.pesquisar.outputs.pesquisa }}
        run: node scripts/enviar-serp-notion.js

  validar:
    if: ${{ inputs.tarefa == 'validar_pautas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar pautas (regras + fontes online)
        env:
          LIMITE: ${{ inputs.limite || '' }}
        run: |
          if [ -n "$LIMITE" ]; then
            node scripts/validar-pautas.js --online --limite "$LIMITE"
          else
            node scripts/validar-pautas.js --online
          fi

  comparar:
    if: ${{ inputs.tarefa == 'comparar_topo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparar com o topo do Google
        env:
          SO: ${{ inputs.so || '' }}
        run: |
          if [ -n "$SO" ]; then
            node scripts/comparar-topo.js --so "$SO"
          else
            node scripts/comparar-topo.js
          fi
      - name: Gravar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pesquisa/comparacao-topo.json data/pesquisa/comparacao-topo.md
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Comparação com o topo do Google atualizada"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || exit 1
