name: Pesquisa SerpAPI (diária)

# Disparada pelo cron-job.org às 01:30 (America/Sao_Paulo), via API do GitHub (workflow_dispatch).
# Pesquisa 1 pauta por execução com status_artigo = "LIVRE PARA SERP" em data/conteudo/pautas-mestre.csv, por maior volume.
# Ignora "PRONTO"; confirma JSON recente antes de promover uma pauta para "PRONTO".
# Só marca "PRONTO" após validar o JSON salvo; falhas preservam "LIVRE PARA SERP".
# Pula resultados válidos dos últimos 14 dias. Para ao bater 1 busca ou a cota mensal.
# Grava em data/entrada/pautas-chat_01/resposta/ e atualiza o status no CSV. Não gera artigo nem publica.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pesquisa-serp
  cancel-in-progress: false

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pesquisar na SerpAPI (1 pauta)
        env:
          SERP_API_KEY: ${{ secrets.SERP___APIKEY }}
        run: node scripts/pesquisa-serp-diaria.js

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Pesquisa SERP"
          git add data/entrada/pautas-chat_01/resposta data/conteudo/pautas-mestre.csv
          if git diff --staged --quiet; then
            echo "Nada novo para gravar"
            exit 0
          fi
          git commit -m "🤖 Pesquisa SerpAPI diária"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
