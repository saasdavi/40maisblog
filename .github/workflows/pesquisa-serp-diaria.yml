name: SERP e atualização de pautas

# Controle de disparo do robô
on:
  # Permite que você ou sistemas externos (como cron-job.org) cliquem no botão para rodar
  workflow_dispatch:

permissions:
  contents: write

# Garante que se você rodar duas vezes seguidas, eles não tentem alterar a planilha ao mesmo tempo
concurrency:
  group: pesquisa-serp
  cancel-in-progress: false

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Abre e baixa os arquivos do seu repositório no robô
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Prepara o ambiente usando a versão atualizada do Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instala as dependências necessárias (de forma explícita)
      - name: Instalar Dependências
        run: |
          # Instalamos apenas o cliente Notion necessário (o script usa fetch nativo para SerpAPI)
          npm install @notionhq/client

      # 3.1 Diagnóstico rápido do ambiente para ajudar debugging
      - name: Diagnóstico ambiente
        run: |
          echo "--- Ambiente ---"
          node -v
          npm -v
          echo "node_modules presentes:" && ls -la node_modules || true

      # 4. Chama o seu script operário injetando as chaves de acesso salvas nos Secrets
      - name: Executar Auditoria SERP na Linha Ativa
        env:
          SERP_API_KEY: ${{ secrets.SERP___APIKEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: node scripts/pesquisa-serp-diaria.js

      # 5. Entra na planilha mestre e salva a alteração da linha atualizada de volta no seu GitHub
      - name: Gravar Novo Status na Planilha Mestre
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action SERP"
          git add data/conteudo/pautas-mestre.csv
          
          # Verifica se o script realmente alterou a linha antes de salvar
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Automação: Linha processada atualizada para PESQUISA CONCLUÍDA"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nenhuma alteração pendente na planilha mestre."
          fi
