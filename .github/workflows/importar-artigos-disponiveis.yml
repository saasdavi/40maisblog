name: Importar artigos disponíveis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artigos-main
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Importar e validar artigos disponíveis
        env:
          FOTO_NA_PUBLICACAO: "1"
        run: node scripts/importar-artigo.js

      - name: Registrar alterações da importação
        shell: bash
        run: |
          set -euo pipefail

          git add -A data/articles.json data/entrada

          if git diff --cached --quiet; then
            echo "Nenhum artigo novo ou alteração de importação nesta execução."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Importar artigos disponíveis"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Resumo
        if: always()
        run: echo "Importação concluída. Confira os logs para ver artigos aceitos, segurados ou rejeitados.";
