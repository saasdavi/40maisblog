name: Importar artigos do Notion para data/entrada/google

# Workflow MANUAL: clica em "Run workflow" e ele vai na página do Notion,
# baixa os artigos prontos e salva como .txt em data/entrada/google/.
# Depois o workflow "Publicação de artigos (manual)" publica 3/dia no blog.

on:
  workflow_dispatch:
    inputs:
      max_artigos:
        description: 'Quantos artigos baixar nesta execução (padrão 10)'
        required: false
        default: '10'
      forcar:
        description: 'Rebaixar artigos que já existem na pasta? (sim/não)'
        required: false
        default: 'não'

permissions:
  contents: write

concurrency:
  group: notion-import
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Baixar artigos do Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: '3eb32d888f64491c9e20c13e6f6a6b24'
          MAX_ARTIGOS: ${{ github.event.inputs.max_artigos || '10' }}
          FORCAR: ${{ github.event.inputs.forcar || 'não' }}
        run: node scripts/notion-para-google.js

      - name: Commit e push dos novos .txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Notion"
          git add data/entrada/google 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nenhum artigo novo baixado do Notion."
            exit 0
          fi
          git commit -m "📥 Notion → data/entrada/google: $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
