name: 📝 Daily Article Production

on:
  # Sem `schedule`: o GitHub atrasa ou descarta agendamentos. Os 3 horários do dia vêm de um cron externo (cron-job.org) que chama
  # a API do GitHub (workflow_dispatch). Passo a passo em CRON-EXTERNO.md.
  # PAUSADO (sem API): as 3 execuções do dia só publicam do estoque pronto e do que o ChatGPT entregar.
  # Os disparos continuam iguais; se o estoque acabar, a execução não escreve nada (não gasta API).
  # Escrita por IA (Gemini/Claude) e SerpAPI ficam nos scripts e workflows manuais, sem apagar nada.
  workflow_dispatch:
    inputs:
      batch:
        description: 'Quantos artigos gerar nesta execução'
        required: false
        default: '1'
      modo:
        description: 'novo = tenta o artigo novo por IA se ainda não saiu um hoje, senão publica do estoque; estoque = só publica do estoque'
        required: false
        default: 'novo'

concurrency:
  group: produce-articles
  cancel-in-progress: false

jobs:
  produce-articles:
    runs-on: ubuntu-latest
    env:
      # '1' (tenta o artigo novo) em qualquer disparo que não peça explicitamente "estoque"
      NOVO: ${{ github.event.inputs.modo != 'estoque' && '1' || '' }}
    # Daily production schedule: 9h UTC (6h AM BRT)
    # Generates 3 articles per day (bilingual pairs + singles)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: 🏆 Prateleira de ouro (nível da fila)
        run: node scripts/prateleira.js

      - name: ✅ Validar próximas pautas (regras + fontes online)
        continue-on-error: true
        run: node scripts/validar-pautas.js

      - name: 📥 Importar artigos novos de data/entrada (já avaliados no chat; entram direto no estoque)
        continue-on-error: true
        env:
          PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOTO_NA_PUBLICACAO: '1'
        run: node scripts/importar-artigo.js

      - name: 🤖 ARTICLE ROBOT 3/DIA - Fluxo Completo
        continue-on-error: true   # se o artigo novo falhar, o estoque completa os 3 do dia
        env:
          # execução sem NOVO: publica do estoque (sem IA); só escreve com a API quando o estoque pronto acabou
          # Pausado: sem API de escrita (Gemini/Claude) nem pesquisa paga. Só publica do estoque pronto e do que o ChatGPT entregar.
          NOVO_COM_IA: ''
          SEM_API: '1'
          PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch || '1' }}
        run: |
          echo "🔥 Iniciando Article Robot (Google Ads API + E-E-A-T Validation)..."
          node scripts/article-robot.js

      - name: 📚 Banco de conteúdo (índice do que está pronto, publicado e por escrever)
        continue-on-error: true
        run: node scripts/banco-conteudo.js

      - name: 📅 Calendário (12 meses e publicação)
        continue-on-error: true
        run: |
          node scripts/calendario-editorial.js
          node scripts/calendario-artigos.js
          node scripts/pautas-chat.js

      - name: 🏗️ Build do site (falha aqui se algo quebrar)
        run: npm run build

      - name: 🔧 Setup Git
        run: |
          git config user.name "Health 40+ Bot"
          git config user.email "bot@health40plus.com"

      - name: 📤 Commit & Push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 Auto: Daily article production"
            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            # outras pessoas/sessões também gravam em main durante a execução: integra antes de enviar (3 tentativas)
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then ok=1; break; fi
              echo "⚠️  tentativa $i falhou, repetindo..."; sleep 5
            done
            [ "$ok" = 1 ] || { echo "❌ push falhou após 3 tentativas"; exit 1; }
            echo "✅ Artigos publicados!"
          else
            echo "⏸️  Nenhum artigo novo para publicar"
          fi

      - name: 🚀 Vercel Deploy Notification
        run: |
          echo "✅ Vercel será notificado via webhook"
          echo "📊 Blog será atualizado automaticamente"

      - name: 📊 Report Stats
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/articles.json'));
          const published = data.articles.filter(a => a.status === 'published').length;
          const ready = data.articles.filter(a => a.status === 'ready_for_publication').length;
          console.log(\`\n📈 Blog Stats:\`);
          console.log(\`   📝 Total articles: \${data.articles.length}\`);
          console.log(\`   ✅ Ready for publish: \${ready}\`);
          console.log(\`   🌐 Published: \${published}\`);
          "

