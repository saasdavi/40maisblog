name: 📝 Daily Article Production

on:
  schedule:
    # Meta: 3 artigos por dia (1 por execução; o teto DAILY_LIMIT=3 por dia de Brasília faz as sobras não publicarem nada).
    # O GitHub atrasa ou descarta agendamentos, então há 6 horários por dia: se alguns falharem, os outros completam os 3.
    # UTC: 06:17, 09:43, 13:43, 17:23, 20:47 e 23:27 (03:17, 06:43, 10:43, 14:23, 17:47 e 20:27 em Brasília).
    # Programação do dia: 1 artigo NOVO escrito por IA (Gemini, reserva Claude, com pesquisa da SerpAPI antes) + 2 do estoque pronto.
    # As execuções das 06:17 e 09:43 UTC tentam o artigo novo (a das 09:43 só tenta se a das 06:17 não publicou um); as demais publicam do estoque
    # sem chamar IA nenhuma. Se o novo falhar, o estoque completa os 3 do dia.
    - cron: '17 6 * * *'
    - cron: '43 9 * * *'
    - cron: '43 13 * * *'
    - cron: '23 17 * * *'
    - cron: '47 20 * * *'
    - cron: '27 23 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Quantos artigos gerar nesta execução'
        required: false
        default: '1'
      modo:
        description: 'novo = 1 artigo novo escrito por IA (Gemini, reserva Claude); estoque = só publica do estoque'
        required: false
        default: 'estoque'

concurrency:
  group: produce-articles
  cancel-in-progress: false

jobs:
  produce-articles:
    runs-on: ubuntu-latest
    env:
      # '1' nas duas primeiras execuções do dia e quando o modo manual é "novo"
      NOVO: ${{ (github.event.schedule == '17 6 * * *' || github.event.schedule == '43 9 * * *' || github.event.inputs.modo == 'novo') && '1' || '' }}
    # Daily production schedule: 9h UTC (6h AM BRT)
    # Generates 3 articles per day (bilingual pairs + singles)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: 🏆 Prateleira de ouro (nível da fila)
        run: node scripts/prateleira.js

      - name: ✅ Validar próximas pautas (regras + fontes online)
        continue-on-error: true
        run: node scripts/validar-pautas.js

      - name: 🔎 SerpAPI - pesquisa da pauta do dia (só na execução do artigo novo)
        if: env.NOVO == '1'
        continue-on-error: true
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: node scripts/serp-api.js

      - name: 🤖 ARTICLE ROBOT 3/DIA - Fluxo Completo
        continue-on-error: ${{ env.NOVO == '1' }}   # se o artigo novo falhar, o estoque completa os 3 do dia
        env:
          SEM_API: ${{ env.NOVO == '1' && '' || '1' }}   # fora do artigo novo: só publica do estoque, sem chamar IA
          NOVO_COM_IA: ${{ env.NOVO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch || '1' }}
        run: |
          echo "🔥 Iniciando Article Robot (Google Ads API + E-E-A-T Validation)..."
          node scripts/article-robot.js

      - name: 📚 Banco de conteúdo (índice do que está pronto, publicado e por escrever)
        continue-on-error: true
        run: node scripts/banco-conteudo.js

      - name: 🏗️ Build do site (falha aqui se algo quebrar)
        run: npm run build

      - name: 🔧 Setup Git
        run: |
          git config user.name "Health 40+ Bot"
          git config user.email "bot@health40plus.com"

      - name: 📤 Commit & Push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 Auto: Daily article production"
            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            # outras pessoas/sessões também gravam em main durante a execução: integra antes de enviar (3 tentativas)
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then ok=1; break; fi
              echo "⚠️  tentativa $i falhou, repetindo..."; sleep 5
            done
            [ "$ok" = 1 ] || { echo "❌ push falhou após 3 tentativas"; exit 1; }
            echo "✅ Artigos publicados!"
          else
            echo "⏸️  Nenhum artigo novo para publicar"
          fi

      - name: 🚀 Vercel Deploy Notification
        run: |
          echo "✅ Vercel será notificado via webhook"
          echo "📊 Blog será atualizado automaticamente"

      - name: 📊 Report Stats
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/articles.json'));
          const published = data.articles.filter(a => a.status === 'published').length;
          const ready = data.articles.filter(a => a.status === 'ready_for_publication').length;
          console.log(\`\n📈 Blog Stats:\`);
          console.log(\`   📝 Total articles: \${data.articles.length}\`);
          console.log(\`   ✅ Ready for publish: \${ready}\`);
          console.log(\`   🌐 Published: \${published}\`);
          "

