name: Publicação de artigos (manual)

# Workflow SOMENTE MANUAL: roda quando você clica em "Run workflow".
# Pega os artigos prontos da pasta data/entrada/google/ (entregues pelo redator),
# valida/audita via importador, publica no blog e faz deploy automático na Vercel.
# Depois atualiza os status automaticamente:
#   - calendario-publicacao.csv -> PUBLICADO ou ERRO PUBLICAÇÃO
#   - pautas-mestre.csv         -> status_publicacao + status_serp

on:
  workflow_dispatch:
    inputs:
      max_artigos:
        description: 'Quantos artigos publicar nesta execução (padrão 3/dia)'
        required: false
        default: '3'
      confirmar_no_site:
        description: 'Após o deploy, conferir se as URLs respondem 200 em 40mais.blog? (sim/não)'
        required: false
        default: 'sim'

permissions:
  contents: write

concurrency:
  group: publicacao-artigos
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Publicar artigos da entrada google
        env:
          MAX_POR_DIA: ${{ github.event.inputs.max_artigos || '3' }}
          FOTO_NA_PUBLICACAO: '1'
          CHECK_SITE: "0"
          PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/publicar-do-google.js

      - name: Commit e push (artigos publicados + planilhas)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Publicação"
          git add data/articles.json data/conteudo/pautas-mestre.csv \
                  "data/entrada/pautas-chat_01/calendario-publicacao.csv" \
                  data/entrada/google data/entrada/processados src/content 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nada para publicar (nenhum arquivo alterado)"
            exit 0
          fi
          git commit -m "📰 Publicação via workflow manual: $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Acionar deploy na Vercel
        if: always()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK" && echo "Deploy acionado."
          else
            echo "VERCEL_DEPLOY_HOOK não configurado; o push acima já dispara o build automático do projeto."
          fi

      - name: Confirmar artigos no site (após deploy)
        if: github.event.inputs.confirmar_no_site == 'sim'
        run: |
          echo "Aguardando 90s para o deploy da Vercel concluir..."
          sleep 90
          node -e '
            const fs = require("fs");
            const db = JSON.parse(fs.readFileSync("data/articles.json", "utf8"));
            const hoje = new Date().toISOString().slice(0, 10);
            const slugs = db.articles.filter(a => a.status === "published" && String(a.publishedAt || "").slice(0, 10) === hoje).map(a => a.slug);
            (async () => {
              for (const s of slugs) {
                try {
                  const r = await fetch("https://40mais.blog/" + s + "/", { redirect: "follow", signal: AbortSignal.timeout(15000) });
                  console.log(`  🔎 /${s}/ -> ${r.status} ${r.status === 200 ? "✅" : "⚠️"}`);
                } catch (e) { console.log(`  🔎 /${s}/ -> erro ${e.message}`); }
              }
            })();
          '
