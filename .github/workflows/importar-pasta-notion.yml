name: Importar pasta data/entrada/google para a Fila de Artigos (Notion)

# Manual: cria uma linha na base "Fila de Artigos" para cada .txt de data/entrada/google/.
# Não commita nada no repositório. Não publica: as linhas entram com o status informado.

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Status das linhas novas'
        required: false
        default: 'Em revisão'

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Criar linhas na Fila de Artigos
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          STATUS: ${{ github.event.inputs.status || 'Em revisão' }}
        run: node scripts/importar-pasta-para-notion.js --gravar
