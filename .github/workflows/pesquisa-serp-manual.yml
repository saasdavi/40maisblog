name: Pesquisa SerpAPI e sincronização Notion

# Sem palavra-chave: sincroniza uma pesquisa JSON já existente para o Notion, sem chamar a SerpAPI.
# Com palavra-chave informada manualmente: executa a pesquisa normal e depois envia o JSON ao Notion.
# Não gera artigos, não publica e não altera o calendário de pautas.

on:
  workflow_dispatch:
    inputs:
      palavra_chave:
        description: 'Opcional: informe apenas se quiser fazer uma NOVA pesquisa SerpAPI. Deixe vazio para sincronizar pesquisa já salva.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pesquisa-serp
  cancel-in-progress: false

jobs:
  pesquisar-ou-sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Escolher modo e pesquisa automaticamente
        id: escolha
        env:
          PALAVRA_INFORMADA: ${{ github.event.inputs.palavra_chave }}
        run: |
          if [ -n "$(printf '%s' "$PALAVRA_INFORMADA" | tr -d '[:space:]')" ]; then
            echo "modo=pesquisar" >> "$GITHUB_OUTPUT"
            echo "palavra=$PALAVRA_INFORMADA" >> "$GITHUB_OUTPUT"
            echo "Modo: nova pesquisa solicitada explicitamente."
            exit 0
          fi

          ARQUIVO=""
          for CANDIDATO in $(find data/entrada/pautas-chat_01/resposta -maxdepth 1 -type f -name '*.json' ! -name 'uso-serpapi.json' -printf '%f\n' | sort); do
            if node -e "const d=require('./data/entrada/pautas-chat_01/resposta/' + process.argv[1]); process.exit(d && d.palavra ? 0 : 1)" "$CANDIDATO" 2>/dev/null; then
              ARQUIVO="$CANDIDATO"
              break
            fi
          done

          if [ -z "$ARQUIVO" ]; then
            echo "::error::Nenhuma pesquisa JSON existente foi encontrada. Não foi chamada a SerpAPI e nenhuma palavra-chave foi inventada."
            exit 1
          fi

          PALAVRA=$(node -e "const d=require('./data/entrada/pautas-chat_01/resposta/' + process.argv[1]); process.stdout.write(d.palavra)" "$ARQUIVO")
          echo "modo=sincronizar" >> "$GITHUB_OUTPUT"
          echo "palavra=$PALAVRA" >> "$GITHUB_OUTPUT"
          echo "arquivo=$ARQUIVO" >> "$GITHUB_OUTPUT"
          echo "Modo: sincronizar pesquisa existente '$PALAVRA' ($ARQUIVO). Nenhuma chamada à SerpAPI."

      - name: Pesquisar na SerpAPI
        if: steps.escolha.outputs.modo == 'pesquisar'
        env:
          SERP_API_KEY: ${{ secrets.SERP___APIKEY }}
          PALAVRA: ${{ steps.escolha.outputs.palavra }}
        run: node scripts/pesquisa-serp-manual.js

      - name: Enviar pesquisa ao Notion (com proteção contra duplicatas)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          PALAVRA: ${{ steps.escolha.outputs.palavra }}
        run: node scripts/enviar-serp-notion.js

      - name: Commit e push do JSON (somente se houve alteração)
        if: steps.escolha.outputs.modo == 'pesquisar'
        env:
          PALAVRA: ${{ steps.escolha.outputs.palavra }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Pesquisa SERP"
          git add data/entrada/pautas-chat_01/resposta
          if git diff --staged --quiet; then
            echo "Nada novo para gravar"
            exit 0
          fi
          git commit -m "🤖 Pesquisa SerpAPI: $PALAVRA"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
