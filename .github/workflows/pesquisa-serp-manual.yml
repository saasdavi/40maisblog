name: Pesquisa SerpAPI (manual)

# Disparo manual, feito por você ou pelo ChatGPT. Faz 1 busca no Google Brasil por palavra-chave.
# Mantém o JSON no GitHub como cópia de segurança e envia a pesquisa completa ao Notion quando NOTION_API_KEY estiver configurada.
# Não gera artigo nem publica.

on:
  workflow_dispatch:
    inputs:
      palavra_chave:
        description: 'Palavra-chave a pesquisar no Google Brasil (uma consulta)'
        required: true

permissions:
  contents: write

concurrency:
  group: pesquisa-serp
  cancel-in-progress: false

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pesquisar na SerpAPI
        id: pesquisar
        env:
          SERP_API_KEY: ${{ secrets.SERP___APIKEY }}
          PALAVRA: ${{ github.event.inputs.palavra_chave }}
        run: node scripts/pesquisa-serp-manual.js

      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Pesquisa SERP"
          git add data/entrada/pautas-chat_01/resposta
          if git diff --staged --quiet; then
            echo "Nada novo para gravar"
            exit 0
          fi
          git commit -m "🤖 Pesquisa SerpAPI: ${{ github.event.inputs.palavra_chave }}"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Enviar pesquisa completa ao Notion
        if: steps.pesquisar.outcome == 'success'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          PALAVRA: ${{ github.event.inputs.palavra_chave }}
        run: |
          ARQUIVO="data/entrada/pautas-chat_01/resposta/$(node -e "console.log(process.env.PALAVRA.normalize('NFKD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''))").json"
          if [ -z -f "$ARQUIVO" ]; then
            echo "Arquivo de pesquisa não encontrado; nada para enviar."
            exit 1
          fi
          node scripts/enviar-serp-notion.js
