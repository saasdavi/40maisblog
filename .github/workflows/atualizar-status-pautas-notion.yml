name: Atualizar status das pautas no Notion

# Manual: "PRONTO" -> "Publicado" e "PESQUISA CONCLUÍDA" -> "Pesquisa pronta" na base Pautas.
# Só muda o status. Não apaga nem cria linhas, não commita e não publica.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Atualizar status
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: node scripts/atualizar-status-pautas-notion.js --gravar
