name: Escrever estoque de artigos (rascunhos prontos)

# Escreve artigos com o robô e guarda no GitHub como rascunho pronto (status draft + estoque:true; o site NÃO mostra).
# As execuções agendadas do "Daily Article Production" publicam do estoque, 3 por dia no máximo.
# Rodar à mão: Run workflow (quantidade = quantos escrever agora; alvo = quantos manter guardados).
# Automático: toda noite escreve 3 até o estoque chegar ao alvo.

on:
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantos artigos escrever nesta execução'
        required: false
        default: '9'
      alvo:
        description: 'Tamanho do estoque a manter (artigos prontos guardados)'
        required: false
        default: '21'
  # agendamento desligado (decisão do usuário, 05/10): sem gasto de API; só manual

concurrency:
  group: produce-articles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  estoque:
    # Pausado (decisão do dono): não escreve com API. Arquivo mantido, não apagar.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: 📋 Comparar com o topo do Google (pautas que ainda faltam) e montar briefings
        continue-on-error: true
        run: |
          node scripts/comparar-topo.js --pendentes 10
          node scripts/briefing.js

      - name: 🤖 Robô em modo ESTOQUE (escreve e guarda como rascunho pronto)
        env:
          ESTOQUE: '1'
          ESTOQUE_ALVO: ${{ github.event.inputs.alvo || '21' }}
          BATCH_SIZE: ${{ github.event.inputs.quantidade || '3' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node scripts/article-robot.js

      - name: 🏗️ Build do site (rascunhos não aparecem; falha aqui se algo quebrar)
        run: npm run build

      - name: 📚 Banco de conteúdo (índice do que está pronto, publicado e por escrever)
        continue-on-error: true
        run: node scripts/banco-conteudo.js

      - name: 📅 Calendário (12 meses e publicação)
        continue-on-error: true
        run: |
          node scripts/calendario-editorial.js
          node scripts/calendario-artigos.js

      - name: 📤 Commit & Push
        run: |
          git config user.name "Health 40+ Bot"
          git config user.email "bot@health40plus.com"
          if [ -z "$(git status --porcelain)" ]; then echo "⏸️  Nada novo"; exit 0; fi
          git add .
          git commit -m "📦 Estoque: artigos escritos e guardados como rascunho pronto"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then ok=1; break; fi
            echo "⚠️  tentativa $i falhou, repetindo..."; sleep 5
          done
          [ "$ok" = 1 ] || { echo "❌ push falhou após 3 tentativas"; exit 1; }
