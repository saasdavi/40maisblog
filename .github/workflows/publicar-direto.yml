name: Publicação direta (1 artigo)

# Workflow SOMENTE MANUAL: roda quando você clica em "Run workflow" ou quando o Activepieces aciona.
# Publica pelo caminho direto da pasta data/entrada/google/, que é o que o site já lê
# (src/lib/artigos-diretos.ts). Não passa pelo importador legado nem pelo data/articles.json.
#
# O script carimba no próprio .txt a foto de capa (CAPA_URL/CAPA_ID/CAPA_CREDITO) e a data
# (DATA_PUBLICACAO). É o carimbo da data que tira o arquivo da fila, então acionar duas vezes
# publica artigos diferentes e nunca republica o mesmo.

on:
  workflow_dispatch:
    inputs:
      max_artigos:
        description: 'Quantos artigos publicar nesta execução (padrão 1)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: publicacao-direta
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Carimbar foto e data no próximo artigo da fila
        env:
          MAX_POR_DIA: ${{ github.event.inputs.max_artigos || '1' }}
          PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/publicar-direto.js

      - name: Commit e push (artigos publicados)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Publicação Direta"
          # só os .txt da fila: o script também grava data/entrada/google/.ultimo-run.json, que não é artigo
          git add 'data/entrada/google/*.txt'
          if git diff --staged --quiet; then
            echo "Nada para publicar (nenhum arquivo alterado)"
            exit 0
          fi
          git commit -m "📰 Publicação direta: $(date -u +%Y-%m-%d)"
          # --autostash: o npm install do job mexe no package-lock.json, e o rebase recusa com alteração não commitada
          git pull --rebase --autostash -q origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Acionar deploy na Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK" && echo "Deploy acionado."
          else
            echo "VERCEL_DEPLOY_HOOK não configurado; o push acima já dispara o build automático do projeto."
          fi
