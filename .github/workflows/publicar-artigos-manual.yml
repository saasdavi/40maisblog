
name: Publicar artigo e acionar deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artigos-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Guardar estado anterior
        run: cp data/articles.json /tmp/articles-before.json

      - name: Publicar um artigo
        id: robot
        env:
          SEM_API: "1"
          BATCH_SIZE: "1"
        shell: bash
        run: |
          set -euo pipefail

          node scripts/article-robot.js

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const before = JSON.parse(
            fs.readFileSync('/tmp/articles-before.json', 'utf8')
          );
          const after = JSON.parse(
            fs.readFileSync('data/articles.json', 'utf8')
          );

          const previous = new Map(
            (before.articles || []).map(a => [
              a.slug,
              { status: a.status, publishedAt: a.publishedAt }
            ])
          );

          const published = (after.articles || []).filter(a => {
            const old = previous.get(a.slug);
            return a.status === 'published' &&
              a.publishedAt &&
              (!old || old.status !== 'published' ||
               old.publishedAt !== a.publishedAt);
          });

          if (published.length !== 1) {
            console.error(
              `Esperado 1 artigo novo; encontrados: ${published.length}.`
            );
            process.exit(1);
          }

          console.log(`Artigo publicado no repositório: ${published[0].slug}`);
          NODE

      - name: Registrar artigo no GitHub
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/articles.json

          if git diff --cached --quiet; then
            echo "::error::Nenhuma alteração no banco de artigos."
            exit 1
          fi

          git commit -m "Publicar um artigo"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Acionar deploy da Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_DEPLOY_HOOK:-}" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK não configurado."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            --request POST \
            "$VERCEL_DEPLOY_HOOK"

          echo "Solicitação de deploy aceita pela resposta HTTP do hook."
