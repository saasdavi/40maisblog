name: Publicar diretamente da pasta Google

on:
  push:
    branches: [main]
    paths:
      - "data/entrada/google/*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artigos-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Solicitar deploy do site com os artigos da pasta Google
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK:-}" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK não configurado."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 --request POST "$VERCEL_DEPLOY_HOOK"
          echo "Solicitação de deploy aceita pelo hook da Vercel."
