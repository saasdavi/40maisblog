name: Importar artigos (sem API)

# Importa artigos de data/entrada/*.txt (escritos fora do robô), audita, baixa fotos e guarda como rascunho pronto.
# Não usa a API da Anthropic.
on:
  workflow_dispatch:

concurrency:
  group: produce-articles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          ref: main
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - name: 📥 Auditar, buscar fotos e guardar no estoque
        env:
          PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOTO_NA_PUBLICACAO: '1'   # sem foto agora (limite das APIs): guarda o artigo e busca a foto na hora de publicar
        run: node scripts/importar-artigo.js
      - name: 🏗️ Build do site
        run: npm run build
      - name: 📚 Banco de conteúdo
        continue-on-error: true
        run: node scripts/banco-conteudo.js

      - name: 📅 Calendário (12 meses e publicação)
        continue-on-error: true
        run: |
          node scripts/calendario-editorial.js
          node scripts/calendario-artigos.js

      - name: 📤 Commit & Push
        run: |
          git config user.name "Health 40+ Bot"
          git config user.email "bot@health40plus.com"
          if [ -z "$(git status --porcelain)" ]; then echo "⏸️  Nada novo"; exit 0; fi
          git add .
          git commit -m "📥 Importados artigos escritos fora do robô"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then ok=1; break; fi
            echo "⚠️  tentativa $i falhou, repetindo..."; sleep 5
          done
          [ "$ok" = 1 ] || { echo "❌ push falhou após 3 tentativas"; exit 1; }
