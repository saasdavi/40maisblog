name: Criar a base Pautas no Notion

# Manual: cria a base "Pautas" e uma linha por pauta de data/conteudo/pautas-mestre.json.
# Não commita nada e não publica.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Criar a base Pautas
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: node scripts/importar-pautas-para-notion.js --gravar
